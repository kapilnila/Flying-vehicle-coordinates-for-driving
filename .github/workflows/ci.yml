name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,service,postgres]"
      - run: python -m pytest
      - run: python -m compileall -q spatial_id tests
  containers:
    runs-on: ubuntu-latest
    env:
      WEB_PORT: '18081'
      TEST_TOKEN: ci-isolated-test-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install httpx
      - run: docker compose -p spatial-id-acceptance -f compose.yaml -f compose.test.yaml up -d --build --wait
      - run: docker compose -p spatial-id-acceptance -f compose.yaml -f compose.test.yaml --profile test run --build --no-deps --rm integration
      - run: docker compose -p spatial-id-acceptance -f compose.yaml -f compose.test.yaml --profile test run --build --no-deps --rm browser-tests
      - run: python -m scripts.lab_acceptance
      - run: python -m scripts.watchdog_acceptance
      - run: python -m scripts.postgres_restore_test
      - run: python -m scripts.failure_test
      - if: always()
        run: docker compose -p spatial-id-acceptance -f compose.yaml -f compose.test.yaml logs --no-color
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: frontend/test-results
      - if: always()
        run: docker compose -p spatial-id-acceptance -f compose.yaml -f compose.test.yaml down

