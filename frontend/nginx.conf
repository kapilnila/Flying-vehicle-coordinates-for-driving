upstream generators { server api-0:8080; server api-1:8080; }
server {
 listen 80;
 root /usr/share/nginx/html;
 client_max_body_size 64k;
 client_body_timeout 2s;
 resolver 127.0.0.11 valid=5s;
 location / { try_files $uri /index.html; }
 location /v1/ { proxy_pass http://generators; proxy_read_timeout 7s; proxy_next_upstream off; }
 location /nodes/0/ { proxy_pass http://api-0:8080/; proxy_read_timeout 6s; }
 location /nodes/1/ { proxy_pass http://api-1:8080/; proxy_read_timeout 6s; }
 location /test-api/ { set $lab http://test-runner:8090; proxy_pass $lab; proxy_read_timeout 8s; }
}
