server {
 listen 80;
 root /usr/share/nginx/html;
 client_max_body_size 64k;
 client_body_timeout 2s;
 location / { try_files $uri /index.html; }
 location /v1/ { proxy_pass http://api-0:8080; proxy_read_timeout 7s; }
 location /nodes/0/ { proxy_pass http://api-0:8080/; }
 location /nodes/1/ { return 503 '{"error":{"message":"Second backend is disabled in standalone mode"}}'; }
 location /test-api/ { return 503 '{"error":{"message":"Start the networked testing configuration to use Test Lab"}}'; }
}
